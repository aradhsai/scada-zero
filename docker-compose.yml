# fuxa-lab — the zero-dollar SCADA stack.
#
#   Node-RED  simulates a pump/tank process and publishes it
#   Mosquitto carries it
#   FUXA      draws it and writes setpoints back
#
# Every component is MIT/EPL/BSD. No licence server, no seat count, nothing
# that expires. Runs on CT100 alongside the other labs; reachable over
# Tailscale only, same pattern as the vault.

name: fuxa-lab

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: fuxa-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "127.0.0.1:1883:1883"   # MQTT
      - "127.0.0.1:9001:9001"   # MQTT over websockets, for browser clients
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nodered:
    image: nodered/node-red:4.1
    container_name: fuxa-nodered
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      TZ: Asia/Kolkata
      NODE_RED_ENABLE_PROJECTS: "false"
    volumes:
      - ./nodered:/data
    ports:
      - "127.0.0.1:1880:1880"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1880/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  fuxa:
    image: frangoteam/fuxa:1.3.3
    container_name: fuxa
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - fuxa_appdata:/usr/src/app/FUXA/server/_appdata
      - fuxa_db:/usr/src/app/FUXA/server/_db
      - fuxa_logs:/usr/src/app/FUXA/server/_logs
      - fuxa_images:/usr/src/app/FUXA/server/_images
    ports:
      - "127.0.0.1:1881:1881"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1881/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mosquitto_data:
  mosquitto_log:
  fuxa_appdata:
  fuxa_db:
  fuxa_logs:
  fuxa_images:
