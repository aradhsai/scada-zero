# Lab broker. Anonymous access is fine here and only here: the whole stack is
# bound to 127.0.0.1 inside one LXC and reachable only over Tailscale. Do not
# copy this file to anything that faces a plant network.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
